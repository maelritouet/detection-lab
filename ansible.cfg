# Relative paths of type "path" are resolved against this file's directory.
# Goal: Ansible keeps no state in $HOME (CLAUDE.md rule 2).

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
home = .ansible
local_tmp = .ansible/tmp
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml

[galaxy]
cache_dir = .ansible/galaxy_cache

[ssh_connection]
control_path_dir = .ansible/cp
# ssh_args is a plain string, so ./.ssh is relative to the working directory.
# Always run Ansible from the repo root (the Makefile does).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o UserKnownHostsFile=./.ssh/known_hosts -o StrictHostKeyChecking=accept-new
pipelining = True

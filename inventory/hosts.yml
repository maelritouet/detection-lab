---
# Lab VMs only. The Fedora host is deliberately NOT listed here: plays that
# target it use the implicit `localhost`, which `hosts: all` never matches.
# That way a VM play can never land on the host by accident.
#
# Per-VM network and sizing live here. This is the single source of truth
# for the libvirt DHCP reservations and the VM definitions.
all:
  children:
    lab_vms:
      vars:
        ansible_user: lab
        ansible_ssh_private_key_file: "{{ inventory_dir | dirname }}/.secrets/lab_ed25519"
        ansible_host: "{{ lab_ip }}"
      children:
        wazuh_server:
          hosts:
            wazuh-server:
              lab_ip: 10.10.10.10
              lab_mac: "52:54:00:10:10:10"
              vm_vcpus: 4
              vm_memory_mib: 8192
              vm_disk_gib: 60
        linux_endpoints:
          hosts:
            ubuntu-ep:
              lab_ip: 10.10.10.20
              lab_mac: "52:54:00:10:10:20"
              vm_vcpus: 2
              vm_memory_mib: 2048
              vm_disk_gib: 20
